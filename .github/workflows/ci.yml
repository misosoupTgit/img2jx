name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-gpu:
    name: gpu / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            mingw: true
          - os: windows-latest
            target: i686-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            linux_deps: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.linux_deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev \
            libxkbcommon-dev \
            libwayland-dev \
            mesa-vulkan-drivers

      - name: Setup MinGW
        if: matrix.mingw
        run: |
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=C:\msys64\mingw64\bin\gcc.exe" >> $env:GITHUB_ENV

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-cross@v1
        with:
          target: ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --features gpu --target ${{ matrix.target }} --locked

      - name: Build
        if: ${{ !matrix.cross }}
        run: cargo build --release --features gpu --target ${{ matrix.target }} --locked

      - name: Test
        if: ${{ !matrix.cross }}
        run: cargo test --features gpu --target ${{ matrix.target }} --locked
