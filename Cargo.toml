[package]
name = "img2jx"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Image ↔ JSON converter CLI"
readme = "README.md"

[[bin]]
name = "img2jx"
path = "src/main.rs"

[features]
default = []
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = "0.25"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
wgpu = { version = "22", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }

[dev-dependencies]
tempfile = "3"
